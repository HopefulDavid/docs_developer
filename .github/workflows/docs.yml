name: Dokumentace

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Kontroly pull requestů se při novém pushi ruší, publikování z main nikdy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Ověření a sestavení
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Načtení úplné historie pro stránku změn
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Instalace .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Instalace Bunu
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Obnovení závislostí
        run: |
          bun ci --ignore-scripts
          dotnet tool restore

      - name: Ověření a sestavení webu
        run: bun run validate

      - name: Předání webu k publikování
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: _site
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publikování do větve gh-pages
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: Převzetí sestaveného webu
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: _site

      - name: Nahrazení obsahu větve gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          force_orphan: true

  # Jediná povinná kontrola v pravidlech větve main, selže, pokud některá potřebná úloha neuspěla.
  ci-ok:
    if: ${{ always() }}
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Souhrn výsledků potřebných úloh
        run: |
          for r in "${{ needs.verify.result }}"; do
            [ "$r" = "success" ] || { echo "Výsledek potřebné úlohy: $r"; exit 1; }
          done
